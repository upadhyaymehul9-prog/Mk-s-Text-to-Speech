<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#4CAF50" />
<meta name="description" content="Browser-based Text-to-Speech with Hindi, Gujarati & English support. Offline-capable PWA." />
<title>Mehul's Text to Speech</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="images.jpeg" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
:root {
  --primary:#4CAF50; --danger:#f44336; --warning:#ff9800; --info:#2196F3;
  --bg:#f0f7ff; --card:#fff; --text:#333; --muted:#777; --border:#e0e0e0;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),#fff);
  display:flex; justify-content:center; min-height:100vh;
}
.container {
  width:100%; max-width:480px;
  background:var(--card);
  border-radius:22px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.1);
}
h1 { text-align:center; font-size:22px; margin-bottom:16px; }

textarea {
  width:100%; height:150px;
  border-radius:14px;
  border:2px solid var(--border);
  padding:14px; font-size:16px; resize:none;
}
textarea:focus { outline:none; border-color:var(--primary); }

.char-count { text-align:right; font-size:12px; color:var(--muted); margin-top:4px; }

.controls { margin-top:14px; }
label { font-size:13px; color:var(--muted); font-weight:600; }

select, input[type="range"] {
  width:100%; margin-top:6px; padding:8px;
  border-radius:8px; border:1px solid var(--border);
}

.buttons {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; margin-top:16px;
}
button {
  padding:14px; border:none; border-radius:12px;
  font-size:15px; font-weight:600; cursor:pointer;
}
button:disabled { opacity:.5; cursor:not-allowed; }

.btn-speak { background:var(--primary); color:#fff; }
.btn-stop { background:var(--danger); color:#fff; }
.btn-pause { background:var(--warning); color:#fff; }
.btn-record { background:var(--info); color:#fff; }

.status {
  margin-top:14px; padding:12px; text-align:center;
  border-radius:10px; font-size:13px;
  background:#f2f2f2; color:var(--muted);
}
.status.speaking { background:rgba(76,175,80,0.1); color:var(--primary); }
.status.recording { background:rgba(244,67,54,0.1); color:var(--danger); animation:pulse 1s infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

.progress {
  height:4px; background:#e0e0e0; border-radius:2px;
  overflow:hidden; margin-top:8px; display:none;
}
.progress.show { display:block; }
.progress div {
  height:100%; width:0%; background:var(--primary);
}

.offline-badge {
  position:fixed; top:10px; right:10px;
  background:#ff9800; color:#fff;
  padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:600; display:none;
}
.offline-badge.show { display:block; }

.footer {
  margin-top:18px; text-align:center;
  font-size:11px; color:#bbb;
}
</style>
</head>

<body>
<div class="offline-badge" id="offline">Offline</div>

<div class="container">
<h1>🗣️ Mehul's Text to Speech</h1>

<textarea id="text" placeholder="Type in English, हिंदी, or ગુજરાતી..."></textarea>
<div class="char-count" id="charCount">0 chars</div>

<div class="controls">
<label>Voice / Language</label>
<select id="voiceSelect">
  <option value="">Auto-detect (Recommended)</option>
</select>
</div>

<div class="controls">
<label>Speed: <span id="rateVal">1.0</span>x</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
</div>

<div class="controls">
<label>Pitch: <span id="pitchVal">1.0</span></label>
<input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
</div>

<div class="buttons">
<button class="btn-speak" id="speak">▶ Speak</button>
<button class="btn-stop" id="stop" disabled>⏹ Stop</button>
<button class="btn-pause" id="pause" disabled>⏸ Pause</button>
<button class="btn-record" id="record">⬇ Save Audio</button>
</div>

<div class="progress" id="progress"><div></div></div>
<div class="status" id="status">Ready</div>

<div class="footer">WEB SPEECH API • PWA • OFFLINE READY</div>
</div>

<script>
const synth = speechSynthesis;
const textEl = document.getElementById('text');
const voiceSel = document.getElementById('voiceSelect');
const rateEl = document.getElementById('rate');
const pitchEl = document.getElementById('pitch');
const statusEl = document.getElementById('status');
const progress = document.getElementById('progress');
const progressFill = progress.firstElementChild;
const speakBtn = document.getElementById('speak');
const stopBtn = document.getElementById('stop');
const pauseBtn = document.getElementById('pause');
const recordBtn = document.getElementById('record');

let voices = [];
let isRecording = false;

/* ---------- VOICES ---------- */
function loadVoices() {
  const prev = voiceSel.value;
  voices = synth.getVoices();
  if (!voices.length) return;

  voices.sort((a,b)=>(/Google|Natural|Enhanced/i.test(b.name))-(/Google|Natural|Enhanced/i.test(a.name)));
  voiceSel.innerHTML = '<option value="">Auto-detect (Recommended)</option>';

  const groups={Hindi:[],Gujarati:[],English:[],Other:[]};
  voices.forEach(v=>{
    const l=v.lang.toLowerCase(), n=v.name.toLowerCase();
    if(l.startsWith('hi')||n.includes('hindi')) groups.Hindi.push(v);
    else if(l.startsWith('gu')||n.includes('gujarati')) groups.Gujarati.push(v);
    else if(l.startsWith('en')) groups.English.push(v);
    else groups.Other.push(v);
  });

  Object.entries(groups).forEach(([k,list])=>{
    if(!list.length) return;
    const og=document.createElement('optgroup');
    og.label=`${k} (${list.length})`;
    list.forEach(v=>{
      const o=document.createElement('option');
      o.value=v.name;
      o.textContent=(/Google|Natural/i.test(v.name)?'⭐ ':'')+v.name;
      og.appendChild(o);
    });
    voiceSel.appendChild(og);
  });

  if(prev && voices.some(v=>v.name===prev)) voiceSel.value=prev;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

/* ---------- HELPERS ---------- */
function detectLang(t){
  if(/[\u0A80-\u0AFF]/.test(t)) return 'gu';
  if(/[\u0900-\u097F]/.test(t)) return 'hi';
  return 'en';
}
function bestVoice(lang){
  return voices.find(v=>v.lang.startsWith(lang))||voices[0];
}
function resetUI(){
  progress.classList.remove('show');
  progressFill.style.width='0%';
  speakBtn.disabled=false;
  stopBtn.disabled=true;
  pauseBtn.disabled=true;
  pauseBtn.textContent='⏸ Pause';
  statusEl.className='status';
}

/* ---------- SPEAK ---------- */
speakBtn.onclick=()=>{
  const t=textEl.value.trim();
  if(!t){statusEl.textContent='Enter text first';return;}

  synth.cancel();
  resetUI();

  const u=new SpeechSynthesisUtterance(t);
  u.voice=voiceSel.value?voices.find(v=>v.name===voiceSel.value):bestVoice(detectLang(t));
  u.rate=+rateEl.value;
  u.pitch=+pitchEl.value;

  let last=0;

  u.onstart=()=>{
    speakBtn.disabled=true;
    stopBtn.disabled=false;
    pauseBtn.disabled=false;
    statusEl.textContent='Speaking...';
    statusEl.className='status speaking';
    progress.classList.add('show');
  };

  u.onboundary=e=>{
    if(e.name==='word'){
      const pct=Math.min(100,Math.max(last,(e.charIndex/t.length)*100));
      last=pct;
      progressFill.style.width=pct+'%';
    }
  };

  u.onend=()=>{
    resetUI();
    statusEl.textContent='Finished';
    window.dispatchEvent(new Event('speechDone'));
  };

  u.onerror=()=>{
    resetUI();
    statusEl.textContent='Error';
  };

  synth.speak(u);
};

/* ---------- PAUSE ---------- */
pauseBtn.onclick=()=>{
  if(!synth.speaking) return;
  if(synth.paused){
    synth.resume();
    pauseBtn.textContent='⏸ Pause';
    statusEl.textContent='Speaking...';
  }else{
    synth.pause();
    pauseBtn.textContent='▶ Resume';
    statusEl.textContent='Paused';
  }
};

/* ---------- STOP ---------- */
stopBtn.onclick=()=>{
  synth.cancel();
  resetUI();
  statusEl.textContent='Stopped';
};

/* ---------- RECORD (FIXED) ---------- */
recordBtn.onclick=async()=>{
  if(isRecording) return;
  if(!textEl.value.trim()){statusEl.textContent='Enter text first';return;}
  if(!confirm("Select 'This Tab' and enable 'Share tab audio'")) return;

  try{
    const stream=await navigator.mediaDevices.getDisplayMedia({video:{width:1,height:1},audio:true});
    if(!stream.getAudioTracks().length) throw new Error('No audio track');

    isRecording=true;
    recordBtn.disabled=true;
    statusEl.textContent='Recording...';
    statusEl.className='status recording';

    const r=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'});
    const chunks=[];
    r.ondataavailable=e=>chunks.push(e.data);

    r.onstop=()=>{
      const b=new Blob(chunks,{type:'audio/webm'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=`tts-${Date.now()}.webm`;
      a.click();
      stream.getTracks().forEach(t=>t.stop());
      isRecording=false;
      recordBtn.disabled=false;
      statusEl.textContent='Saved';
      statusEl.className='status';
    };

    const MIN_MS=700;
    const startTime=Date.now();

    r.start();

    if(!synth.speaking) speakBtn.click();

    window.addEventListener('speechDone',()=>{
      const elapsed=Date.now()-startTime;
      const delay=Math.max(0,MIN_MS-elapsed);
      setTimeout(()=>{ if(r.state==='recording') r.stop(); },delay);
    },{once:true});

  }catch(e){
    isRecording=false;
    recordBtn.disabled=false;
    statusEl.textContent=e.message||'Recording failed';
    statusEl.className='status';
  }
};

/* ---------- LIVE UI ---------- */
rateEl.oninput=()=>document.getElementById('rateVal').textContent=rateEl.value;
pitchEl.oninput=()=>document.getElementById('pitchVal').textContent=pitchEl.value;
textEl.oninput=()=>document.getElementById('charCount').textContent=textEl.value.length+' chars';

/* ---------- OFFLINE ---------- */
const offline=document.getElementById('offline');
window.addEventListener('online',()=>offline.classList.remove('show'));
window.addEventListener('offline',()=>offline.classList.add('show'));
if(!navigator.onLine) offline.classList.add('show');

/* ---------- SERVICE WORKER ---------- */
if('serviceWorker'in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
