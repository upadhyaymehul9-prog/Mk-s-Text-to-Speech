<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehul's Natural TTS Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* General Layout - Restored & Optimized */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f0f7ff 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 22px; color: #1a202c; margin: 0; }

        textarea {
            width: 100%;
            height: 150px;
            border-radius: 12px;
            border: 1px solid #cbd5e0;
            padding: 15px;
            font-size: 16px;
            outline: none;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #4a5568;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background-color: #f7fafc;
            cursor: pointer;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.96); }

        #speak-btn { background-color: #48bb78; }
        #stop-btn { background-color: #f56565; }
        #download-btn { 
            background-color: #4299e1; 
            grid-column: span 2; 
            margin-top: 5px;
        }

        .status-msg {
            font-size: 12px;
            color: #718096;
            text-align: center;
            margin-top: 10px;
        }

        /* Version Tag for tracking updates */
        .v-tag {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e0;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span style="font-size: 24px; margin-right: 10px;">🎙️</span>
            <h1>Mehul's AI Voice Pro</h1>
        </div>

        <textarea id="text-input" placeholder="Enter text... Use commas for natural pauses!"></textarea>

        <div class="control-group">
            <label>AI Voice Selection (⭐ = Best)</label>
            <select id="voice-select"></select>
        </div>

        <div class="control-group">
            <label>Speed (Rate): <span id="rate-label">0.9</span></label>
            <input type="range" id="rate" min="0.5" max="1.3" value="0.9" step="0.1">
        </div>

        <div class="control-group">
            <label>Pitch: <span id="pitch-label">1.0</span></label>
            <input type="range" id="pitch" min="0.5" max="1.5" value="1.0" step="0.1">
        </div>

        <div class="button-grid">
            <button id="speak-btn">▶️ Play</button>
            <button id="stop-btn">⏹️ Stop</button>
            <button id="download-btn">⬇️ Download Audio (Record)</button>
        </div>
        
        <p class="status-msg" id="status">Ready to speak</p>
    </div>

    <div class="v-tag">VERSION 2.0 - HIGH QUALITY MODE</div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateInput = document.getElementById('rate');
        const pitchInput = document.getElementById('pitch');
        const rateLabel = document.getElementById('rate-label');
        const pitchLabel = document.getElementById('pitch-label');
        const statusMsg = document.getElementById('status');

        let voices = [];

        function populateVoiceList() {
            voices = synth.getVoices();
            
            // AI QUALITY LOGIC: Prioritize 'Google', 'Natural', or 'Premium' voices
            const sortedVoices = voices.sort((a, b) => {
                const isAi = (v) => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Enhanced');
                return isAi(b) - isAi(a);
            });

            voiceSelect.innerHTML = '';
            sortedVoices.forEach((voice, i) => {
                const option = document.createElement('option');
                const isPremium = voice.name.includes('Google') || voice.name.includes('Natural') || voice.name.includes('Enhanced');
                option.textContent = (isPremium ? '⭐ ' : '') + `${voice.name} (${voice.lang})`;
                option.value = i;
                
                // Default to a known good voice if available
                if (voice.name.includes('Google US English') || (voice.lang === 'en-US' && voice.name.includes('Samantha'))) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }
        populateVoiceList();

        rateInput.oninput = () => rateLabel.textContent = rateInput.value;
        pitchInput.oninput = () => pitchLabel.textContent = pitchInput.value;

        function createUtterance() {
            const utter = new SpeechSynthesisUtterance(textInput.value);
            const selectedVoice = voices[voiceSelect.value];
            utter.voice = selectedVoice;
            utter.rate = rateInput.value;
            utter.pitch = pitchInput.value;
            return utter;
        }

        document.getElementById('speak-btn').onclick = () => {
            if (synth.speaking) synth.cancel();
            if (textInput.value !== '') {
                const utter = createUtterance();
                synth.speak(utter);
            }
        };

        document.getElementById('stop-btn').onclick = () => synth.cancel();

        // RECORDING & DOWNLOAD LOGIC
        document.getElementById('download-btn').onclick = async () => {
            if (textInput.value === '') return alert("Please enter text first");

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { displaySurface: "browser", width: 1 }, 
                    audio: true 
                });

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                statusMsg.textContent = "Recording... please wait for speech to finish.";
                statusMsg.style.color = "#f56565";

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'mehul-speech.webm';
                    a.click();
                    statusMsg.textContent = "Download complete!";
                    statusMsg.style.color = "#48bb78";
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                const utter = createUtterance();
                utter.onend = () => {
                    setTimeout(() => mediaRecorder.stop(), 500);
                };
                
                synth.speak(utter);
            } catch (err) {
                alert("To download, you must select 'This Tab' and check 'Share Tab Audio'.");
            }
        };
    </script>
</body>
</html>
